name: PR Check

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, ready_for_review]
    paths:
      - "sdk/**"
      - "cli/**"
      - "bindings/**"
      - "tests/**"
      - "third-party/**"
      - ".gitmodules"
      - ".github/**"
      - "*bazel*"
  # Seeds ccache on main so the first PR run off a new base hits warm.
  push:
    branches: [main]
    paths:
      - "sdk/**"
      - "third-party/**"
      - ".gitmodules"
      - ".github/**"
      - "*bazel*"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Draft PRs run lint only; ready_for_review triggers the full graph.
jobs:
  lint:
    name: lint
    uses: ./.github/workflows/_lint.yml

  build-sdk:
    name: build-sdk
    needs: [lint]
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    uses: ./.github/workflows/_build-sdk.yml
    secrets:
      HEXAGON_HTP_CERT_PFX: ${{ secrets.HEXAGON_HTP_CERT_PFX }}
    with:
      upload_artifact: true

  build-python-sdist:
    name: build-python-sdist
    needs: [lint]
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    uses: ./.github/workflows/_build-python-sdist.yml
    with:
      upload_artifact: true

  test-decision-protocols:
    name: test-decision-protocols
    needs: [lint]
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: false
      - name: Resolve changed files
        id: files
        uses: ./.github/actions/changed-files
        with:
          include: '^(sdk|third-party|tests|\.github)/'
      - name: Install build tools
        if: steps.files.outputs.any == 'true'
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build ccache
      - name: Cache compiler outputs
        if: steps.files.outputs.any == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: decision-ccache-${{ runner.os }}-${{ hashFiles('tests/decision/**', 'sdk/plugins/llama_cpp/**') }}
          restore-keys: |
            decision-ccache-${{ runner.os }}-
      - name: Run model-free decision tests
        if: steps.files.outputs.any == 'true'
        run: |
          git submodule update --init --depth 1 third-party/llama.cpp
          cmake -S tests/decision -B build-decision-tests -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DGENIEX_DECISION_REFERENCE_TESTS=OFF -DGGML_NATIVE=OFF \
            -DGGML_OPENCL=OFF -DGGML_HEXAGON=OFF -DGGML_CUDA=OFF \
            -DGGML_VULKAN=OFF -DGGML_METAL=OFF -DGGML_BLAS=OFF -DGGML_OPENMP=OFF
          cmake --build build-decision-tests --target decision-tests --parallel "$(nproc)"
          ctest --test-dir build-decision-tests --output-on-failure

  test-rust:
    name: test-rust
    needs: [lint]
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    uses: ./.github/workflows/_test-rust.yml

  build-cli:
    name: build-cli
    needs: [build-sdk]
    uses: ./.github/workflows/_build-cli.yml
    with:
      upload_artifact: true

  build-android-aar:
    name: build-android-aar
    needs: [build-sdk]
    uses: ./.github/workflows/_build-android-aar.yml
    with:
      upload_artifact: true

  build-docker:
    name: build-docker
    needs: [build-sdk]
    uses: ./.github/workflows/_build-docker.yml
    with:
      push: false

  test-go:
    name: test-go
    needs: [build-sdk]
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    uses: ./.github/workflows/_unit-test.yml
    with:
      language: go
      gate_on_changed_files: true

  test-python:
    name: test-python
    needs: [build-sdk]
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    uses: ./.github/workflows/_unit-test.yml
    with:
      language: python
      gate_on_changed_files: true

  test-sdk-ci:
    name: test-sdk-ci
    needs: [build-sdk]
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    uses: ./.github/workflows/_unit-test.yml
    with:
      language: sdk
      # Linux currently can't run the llama_cpp plugin tests (libOpenCL.so.1
      # missing in the ubuntu:24.04 toolchain image). Re-enable linux-arm64
      # once the plugin can dlopen without an OpenCL ICD on the host.
      platforms: '["windows-arm64"]'
      gate_on_changed_files: true

  # Not on push to main: the PR already ran it, and test.yml's nightly covers main.
  test-sdk-qdc:
    name: test-sdk-qdc
    needs: [build-sdk]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false)
    uses: ./.github/workflows/_qdc-test.yml
    secrets:
      QDC_API_KEY: ${{ secrets.QDC_API_KEY }}
    with:
      gate_on_changed_files: true
      tier: pr
