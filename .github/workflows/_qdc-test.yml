name: QDC Test

# On-device pytest, one leg per platform. Callers supply the sdk-<platform>
# artifacts; this workflow never builds. Called by test.yml (nightly / tag /
# dispatch, tier=full) and pr-check.yml (change-gated, tier=pr).
#
# tier=pr is the smoke set: windows + android only (QCS9075M often queues for
# hours), no CPU cells (test-sdk-ci covers them), no `nightly`-marked models.

on:
  workflow_call:
    inputs:
      gate_on_changed_files:
        description: "Skip the cell when no files match the QDC path filter."
        required: false
        type: boolean
        default: true
      tier:
        description: "pr = smoke subset on the in_pr legs; full = everything."
        required: false
        type: string
        default: full
    secrets:
      QDC_API_KEY:
        required: false

permissions:
  contents: read
  packages: read

jobs:
  qdc:
    name: ${{ matrix.platform }} (${{ matrix.device }})
    runs-on: ubuntu-latest
    # Device queueing alone has reached ~3h (v0.9.4-rc.1), so the PR tier needs
    # far more than its ~25 min run.
    timeout-minutes: ${{ inputs.tier == 'pr' && 240 || 345 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            device: QCS9075M
            artifact: sdk-linux-arm64
            in_pr: false
          - platform: windows
            device: SC8480XP
            artifact: sdk-windows-arm64
            in_pr: true
          - platform: android
            device: SM8850
            artifact: sdk-android-arm64
            in_pr: true
    env:
      QDC_API_KEY: ${{ secrets.QDC_API_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: false

      - name: Resolve changed files
        id: files
        if: inputs.gate_on_changed_files
        uses: ./.github/actions/changed-files
        with:
          # Only what changes the on-device run: SDK runtime sources and
          # submodules, model-manager's chipset / AI Hub asset selection (the
          # rest of it is covered by test-rust and test-sdk-ci), the tests/
          # tree QDC bundles, and the QDC / SDK-build CI. One ERE per line, no
          # blank lines: an empty pattern would match every file.
          include: |-
            ^sdk/(src|include|plugins|patches|cmake)/
            ^sdk/CMake(Lists\.txt|Presets\.json)$
            ^sdk/model-manager/src/source/ai_hub/
            ^sdk/model-manager/src/(host\.rs|ffi/chipset\.rs)$
            ^sdk/benchmark/qdc/_qdc\.py$
            ^third-party/
            ^\.gitmodules$
            ^tests/
            ^\.github/workflows/(_qdc-test|_build-sdk)\.yml$
            ^\.github/actions/(install-qdc-sdk|setup-snapdragon-sdks)/
            ^\.github/certs/hexagon/
          exclude: '\.md$|^tests/(test_api\.py|ruff\.toml)$'

      - name: Decide skip
        id: skip
        shell: bash
        env:
          GATE: ${{ inputs.gate_on_changed_files }}
          ANY: ${{ steps.files.outputs.any }}
          # Fork PRs intentionally receive no repository secrets.  Treat a
          # missing QDC credential as an unavailable hardware lane instead of
          # invoking the dispatcher with an empty key and failing every cell.
          HAS_QDC_API_KEY: ${{ secrets.QDC_API_KEY != '' }}
          PLATFORM: ${{ matrix.platform }}
          TIER: ${{ inputs.tier }}
          IN_PR: ${{ matrix.in_pr }}
        run: |
          set -euo pipefail
          if [ "$HAS_QDC_API_KEY" != "true" ]; then
            echo "::notice::QDC_API_KEY is unavailable; skipping $PLATFORM"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ "$TIER" = "pr" ] && [ "$IN_PR" != "true" ]; then
            echo "::notice::$PLATFORM runs in the nightly full tier only"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ "$GATE" = "true" ] && [ "$ANY" != "true" ]; then
            echo "No QDC-relevant path changes — skipping $PLATFORM"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v7
        if: steps.skip.outputs.skip != 'true'
        with:
          python-version: "3.11"

      - uses: actions/download-artifact@v8
        if: steps.skip.outputs.skip != 'true'
        with:
          name: ${{ matrix.artifact }}
          path: pkg-geniex

      - uses: ./.github/actions/install-qdc-sdk
        if: steps.skip.outputs.skip != 'true'

      - if: steps.skip.outputs.skip != 'true'
        env:
          PLATFORM: ${{ matrix.platform }}
          DEVICE: ${{ matrix.device }}
          TIER: ${{ inputs.tier }}
          # QDC wait in seconds, queue included; ~20 min under timeout-minutes
          # for log download. full matches bench's 330 min under the 6h runner cap.
          JOB_TIMEOUT: ${{ inputs.tier == 'pr' && 13200 || 19800 }}
        # exec so a runner cancel's SIGINT reaches python, which aborts the QDC job.
        run: >
          exec python tests/qdc/run_qdc_pytest.py
          --pkg-dir pkg-geniex
          --platform "$PLATFORM"
          --device "$DEVICE"
          --tier "$TIER"
          --job-timeout "$JOB_TIMEOUT"
          --logs-dir qdc-logs

      - name: Upload QDC device logs
        if: always() && steps.skip.outputs.skip != 'true' && hashFiles('qdc-logs/**') != ''
        uses: actions/upload-artifact@v7
        with:
          name: qdc-logs-${{ matrix.platform }}-${{ matrix.device }}
          path: qdc-logs/
          retention-days: 7
          if-no-files-found: ignore
