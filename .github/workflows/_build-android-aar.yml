name: Build Android AAR

on:
  workflow_call:
    inputs:
      upload_artifact:
        description: "Whether to upload the AAR artifact"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.variant }}
    # The gradle project is variant-agnostic: it copies whatever lib/ subdirs
    # sdk/pkg-geniex ships, so the CPU-only package just yields fewer jniLibs. #1217
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: default
            sdk_artifact: sdk-android-arm64
            tag_suffix: ""
          - variant: cpu
            sdk_artifact: sdk-android-arm64-cpu
            tag_suffix: "-cpu"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: false

      # Silences the default-branch hint gradle's internal git init prints.
      - name: Configure git
        shell: bash
        run: git config --global init.defaultBranch main

      - name: Download Android SDK package
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.sdk_artifact }}
          path: sdk/pkg-geniex

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Versions must match bindings/android/app/build.gradle.kts.
      - name: Install Android SDK packages (sdkmanager)
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_SDK_ROOT:?ANDROID_SDK_ROOT must be set on the runner}"
          sdkmanager_bin="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$sdkmanager_bin" ] || {
            echo "::error::sdkmanager not found at $sdkmanager_bin"; exit 1;
          }
          yes | "$sdkmanager_bin" --licenses >/dev/null 2>&1 || true
          "$sdkmanager_bin" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;29.0.14206865"
          echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-android-${{ hashFiles('bindings/android/**/*.gradle*', 'bindings/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-android-

      - name: Assemble release AAR
        working-directory: bindings/android
        run: ./gradlew --no-daemon assembleRelease

      - name: Collect AAR
        id: aar
        env:
          TAG_SUFFIX: ${{ matrix.tag_suffix }}
        shell: bash
        run: |
          set -euo pipefail
          src="bindings/android/app/build/outputs/aar/app-release.aar"
          [ -f "$src" ] || { echo "::error::AAR not found at $src"; exit 1; }
          mkdir -p dist-aar
          out="dist-aar/geniex-android-aar${TAG_SUFFIX}.aar"
          cp "$src" "$out"
          echo "path=$out" >> "$GITHUB_OUTPUT"

      - name: Upload AAR artifact
        if: inputs.upload_artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-aar${{ matrix.tag_suffix }}
          path: ${{ steps.aar.outputs.path }}
          if-no-files-found: error
          retention-days: 1
