[package]
name = "model-manager"
version = "0.1.0"
edition = "2021"

# staticlib is what the SDK links (`geniex_model.lib` / `libgeniex_model.a`);
# rlib lets integration tests use the Rust API.
[lib]
name = "geniex_model"
crate-type = ["staticlib", "rlib"]

# `panic` stays at the default ("unwind"): `ffi::types::ffi_guard` relies on
# `catch_unwind` to turn panics into error codes before they cross the C ABI.

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
fs2 = "0.4"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "io-util",
    "fs",
    "time",
] }
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }
# Manual roots (no built-in webpki bundle) so our own platform verifier
# can delegate to the OS trust store — required for corporate MITM proxies.
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls-manual-roots",
    "http2",
] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
async-trait = "0.1"
url = "2"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tempfile = { version = "3", optional = true }
wiremock = { version = "0.6", optional = true }
zip = { version = "9.0.5", default-features = false, features = ["deflate"], optional = true }

[features]
test-support = ["dep:tempfile", "dep:wiremock", "dep:zip"]

# rustls-platform-verifier needs JNI-side init on Android that the binding
# doesn't do, so Android falls back to bundled webpki-roots (no system CAs).
[target.'cfg(not(target_os = "android"))'.dependencies]
rustls-platform-verifier = "0.5"

[target.'cfg(target_os = "android")'.dependencies]
webpki-roots = "0.26"

[dev-dependencies]
model-manager = { path = ".", features = ["test-support"] }
tempfile = "3"
wiremock = "0.6"
tokio = { version = "1", features = ["test-util", "net"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
